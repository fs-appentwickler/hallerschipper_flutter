name: hallerschipper
description: Digitale Liedersammlung der Hallerschipper mit Offline-Nutzung und GitHub-Liedupdates.
publish_to: 'none'

# Bei einem bestehenden Projekt die bisherige Version übernehmen und die
# Buildnummer (nach dem +) für eine neue Android-Version erhöhen.
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/songs.json
    - assets/logo.png
